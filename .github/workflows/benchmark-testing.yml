name: Benchmark Testing

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  benchmark-testing:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          persist-credentials: false

      # only push runs of this repo, the binaries below get executed
      - name: Get run IDs and SHAs
        id: get-runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          DEFAULT_BRANCH=$(gh api "/repos/$REPO" -q '.default_branch')

          RUNS_INFO=$(gh api -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/actions/workflows/tests.yml/runs?branch=$DEFAULT_BRANCH&event=push&status=success&per_page=100" \
            -q "[.workflow_runs[] | select(.event == \"push\" and .conclusion == \"success\" and .head_branch == \"$DEFAULT_BRANCH\" and .head_repository.full_name == \"$REPO\")] | sort_by(.created_at) | reverse | .[] | {id: .id, sha: .head_sha}" \
            | head -n 2)

          echo "Found runs info:"
          echo "$RUNS_INFO"

          if [ -z "$RUNS_INFO" ]; then
            echo "No successful runs found"
            exit 1
          fi

          LATEST_RUN=$(echo "$RUNS_INFO" | head -n 1)
          PREVIOUS_RUN=$(echo "$RUNS_INFO" | tail -n 1)

          {
            echo "latest_run=$(echo "$LATEST_RUN" | jq -r '.id')"
            echo "latest_sha=$(echo "$LATEST_RUN" | jq -r '.sha')"
            echo "previous_run=$(echo "$PREVIOUS_RUN" | jq -r '.id')"
            echo "previous_sha=$(echo "$PREVIOUS_RUN" | jq -r '.sha')"
          } >> "$GITHUB_OUTPUT"

      - name: Download Latest Version Binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: typesense-server
          path: ./current-binary
          run-id: ${{ steps.get-runs.outputs.latest_run }}
          github-token: ${{ github.token }}

      - name: Download Previous Version Binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: typesense-server
          path: ./base-binary
          run-id: ${{ steps.get-runs.outputs.previous_run }}
          github-token: ${{ github.token }}

      - name: Make binaries executable
        run: |
          chmod +x ./current-binary/typesense-server
          chmod +x ./base-binary/typesense-server

      # same rule for the stored benchmark data: only runs this workflow started itself
      - name: Find previous benchmark data
        id: get-data-run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          DEFAULT_BRANCH=$(gh api "/repos/$REPO" -q '.default_branch')

          RUN_IDS=$(gh api -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/actions/workflows/benchmark-testing.yml/runs?branch=$DEFAULT_BRANCH&per_page=50" \
            -q "[.workflow_runs[] | select((.event == \"schedule\" or .event == \"workflow_dispatch\") and .head_branch == \"$DEFAULT_BRANCH\" and .head_repository.full_name == \"$REPO\" and .id != $CURRENT_RUN)] | sort_by(.created_at) | reverse | .[].id")

          for RUN_ID in $RUN_IDS; do
            HAS_DATA=$(gh api "/repos/$REPO/actions/runs/$RUN_ID/artifacts?name=benchmark-data" \
              -q '[.artifacts[] | select(.expired == false)] | length')
            if [ "$HAS_DATA" != "0" ]; then
              echo "Using benchmark data from run $RUN_ID"
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "No previous benchmark data found"

      - name: Download previous benchmark data
        if: steps.get-data-run.outputs.run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: benchmark-data
          path: ./benchmark/influxdb-data
          run-id: ${{ steps.get-data-run.outputs.run_id }}
          github-token: ${{ github.token }}
        continue-on-error: true

      # Prepare InfluxDB
      - name: Prepare data directory
        working-directory: benchmark
        run: |
          mkdir -p ./influxdb-data
          sudo chown -R 999:999 ./influxdb-data

      - name: Start containers
        working-directory: benchmark
        run: docker compose up -d

      - name: Wait for InfluxDB to be ready
        working-directory: benchmark
        run: |
          timeout 30s bash -c '
          until curl -s http://localhost:8086/ping; do
            echo "Waiting for InfluxDB..."
            sleep 1
          done
          '

      - name: Setup Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: benchmark
        run: |
          npm install -g pnpm
          pnpm install

      - name: Build CLI
        working-directory: benchmark
        run: pnpm build

      - name: Run Benchmark Comparison
        working-directory: benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LATEST_SHA: ${{ steps.get-runs.outputs.latest_sha }}
          PREVIOUS_SHA: ${{ steps.get-runs.outputs.previous_sha }}
        run: |
          # Print the SHAs for reference
          echo "Latest SHA: $LATEST_SHA"
          echo "Previous SHA: $PREVIOUS_SHA"
          
          ./dist/index.js benchmark \
            --binaries $(pwd)/../base-binary/typesense-server $(pwd)/../current-binary/typesense-server -c "$PREVIOUS_SHA" "$LATEST_SHA" -d $(pwd)/benchmark-workdir  -y -v  --duration 1m

      # Fix permissions and save data
      - name: Fix permissions for artifact upload
        if: always()
        working-directory: benchmark
        run: |
          sudo chown -R $USER:$USER ./influxdb-data
          sudo find ./influxdb-data -type d -exec chmod 755 {} \;
          sudo find ./influxdb-data -type f -exec chmod 644 {} \;

      - name: Upload benchmark data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: benchmark-data
          path: ./benchmark/influxdb-data
          if-no-files-found: warn
          compression-level: 6
          overwrite: false

      - name: Upload reproduction guide
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: reproduction-guide
          path: benchmark/reproduction-guide.md
          if-no-files-found: ignore

      - name: Stop containers
        if: always()
        working-directory: benchmark
        run: docker compose down
