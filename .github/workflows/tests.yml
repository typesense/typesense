name: tests

on: [push, pull_request]

# Cancel previous running if a new push is made
# Source: https://stackoverflow.com/a/72408109/123545
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # one Bazel disk-cache name for the default branch and every PR (fork PRs get no repository variables); bump
  # it to start empty. Each push to the default branch saves a new entry, and each ISO week starts empty:
  # Bazel 6.2 never marks an entry as read, so entries a build no longer uses can't be pruned.
  BAZEL_DISK_CACHE: main-jan21-2026
  # only a push to the default branch saves the disk cache; every other run only reads it
  SAVES_CACHE: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}

jobs:
  # without a cache the build compiles everything, so it goes to COLD_RUNNER; skipped when that isn't set
  cache-probe:
    if: vars.COLD_RUNNER != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-22.04
    outputs:
      warm: ${{ steps.lookup.outputs.cache-matched-key != '' }}
      week: ${{ steps.week.outputs.week }}
      last_week: ${{ steps.week.outputs.last_week }}
    steps:
      - id: week
        run: |
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          echo "last_week=$(date -u -d '7 days ago' +%G-W%V)" >> "$GITHUB_OUTPUT"
      # the same path and key prefix as the test job's disk cache
      - id: lookup
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/.cache/bazel-disk
          key: bazel-disk-${{ env.BAZEL_DISK_CACHE }}-${{ steps.week.outputs.week }}-
          restore-keys: |
            bazel-disk-${{ env.BAZEL_DISK_CACHE }}-${{ steps.week.outputs.week }}-
            ${{ env.SAVES_CACHE != 'true' && format('bazel-disk-{0}-{1}-', env.BAZEL_DISK_CACHE, steps.week.outputs.last_week) || '' }}
          lookup-only: true

  # builds only the server, so the API tests start without waiting for the C++ suite
  build:
    needs: cache-probe
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ${{ needs.cache-probe.outputs.warm == 'true' && (vars.TEST_RUNNER || 'ubuntu-22.04') || (vars.COLD_RUNNER || vars.TEST_RUNNER || 'ubuntu-22.04') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/bazel-setup
        with:
          cache-name: ${{ env.BAZEL_DISK_CACHE }}
          saves-cache: ${{ env.SAVES_CACHE }}
          week: ${{ needs.cache-probe.outputs.week }}
          last-week: ${{ needs.cache-probe.outputs.last_week }}

      - name: Build Typesense
        run: bazel build //:typesense-server

      # Source: https://github.com/actions/upload-artifact/issues/92#issuecomment-1080347032
      - name: Set BAZEL_BIN_FULL_PATH
        run: echo "BAZEL_BIN_FULL_PATH=$(readlink -f bazel-bin)" >> $GITHUB_ENV

      - name: Save build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typesense-server
          path: ${{ env.BAZEL_BIN_FULL_PATH }}/typesense-server

  test:
    needs: cache-probe
    # a same-repo PR is already tested by its branch's push run
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ${{ needs.cache-probe.outputs.warm == 'true' && (vars.TEST_RUNNER || 'ubuntu-22.04') || (vars.COLD_RUNNER || vars.TEST_RUNNER || 'ubuntu-22.04') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - id: setup
        uses: ./.github/actions/bazel-setup
        with:
          cache-name: ${{ env.BAZEL_DISK_CACHE }}
          saves-cache: ${{ env.SAVES_CACHE }}
          week: ${{ needs.cache-probe.outputs.week }}
          last-week: ${{ needs.cache-probe.outputs.last_week }}

      - name: Build Typesense
        run: bazel build //:typesense-server

      - name: Setup artifacts for tests
        run: curl https://dl.typesense.org/ci/tyrec/tyrec-1-models.tar.gz > ./test/resources/models.tar.gz

      - name: Run tests
        run: bazel test --cache_test_results=no --test_output=all //:typesense-test --test_timeout=900

      # only the default branch writes, so every PR starts from its newest build; a failed test still saves
      - name: Save the Bazel disk cache
        if: ${{ !cancelled() && env.SAVES_CACHE == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/.cache/bazel-disk
          key: bazel-disk-${{ env.BAZEL_DISK_CACHE }}-${{ steps.setup.outputs.week }}-${{ github.sha }}

      - name: Set BAZEL_TESTLOGS_FULL_PATH
        run: echo "BAZEL_TESTLOGS_FULL_PATH=$(readlink -f bazel-testlogs)" >> $GITHUB_ENV
        if: failure()

      - name: Save test logs on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs
          path: ${{ env.BAZEL_TESTLOGS_FULL_PATH }}/
        if: failure()

  api-tests:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    # a passing run takes a few minutes; this bounds a hang
    timeout-minutes: 10
    env:
      HAS_API_SECRETS: ${{ secrets.OPENAI_API_KEY != '' && secrets.AZURE_OPENAI_API_KEY != '' && secrets.AZURE_OPENAI_URL != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # default-branch pushes own the shared entry, pr saves stay in the pr scope
      - name: Restore model cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ./hf_cache
          key: tei-model-sentence-transformers-all-MiniLM-L6-v2

      - name: Check cache contents
        run: |
          # Check what we actually downloaded
          echo "Contents of hf_cache directory:"
          ls -la ./hf_cache/ || echo "hf_cache directory is empty or doesn't exist"

          # Create empty cache directory if none exists
          if [ ! -d "./hf_cache" ]; then
            echo "No cached model found, will download fresh"
            mkdir -p ./hf_cache
          fi

      # these run while the binary downloads and bun installs; the wait step below checks each one's exit status
      - name: Start TEI, gdb and the v29 download
        run: |
          mkdir -p "$RUNNER_TEMP/setup"
          start() {
            name=$1; shift
            # the || keeps the step's errexit from ending the subshell before it writes the status
            ( start_s=$SECONDS; rc=0; "$@" > "$RUNNER_TEMP/setup/$name.log" 2>&1 || rc=$?; echo "$rc $((SECONDS - start_s))" > "$RUNNER_TEMP/setup/$name.tmp"
              mv "$RUNNER_TEMP/setup/$name.tmp" "$RUNNER_TEMP/setup/$name.rc" ) &
          }
          start tei docker run -d --name tei-container --runtime=runc -p 8080:80 \
            -v ${{ github.workspace }}/hf_cache:/data \
            ghcr.io/huggingface/text-embeddings-inference:cpu-latest@sha256:cc1f06b5b2e38d979aca1cc054675426bf4d94247f6d22e399d73e09131dfe79 \
            --model-id sentence-transformers/all-MiniLM-L6-v2
          # gdb records every thread's stack when a server doesn't stop
          start gdb bash -c 'sudo apt-get install -y gdb || { sudo apt-get update && sudo apt-get install -y gdb; }'
          start v29 bash -c 'mkdir -p api_tests/artifacts/v29 &&
            curl -fsSL https://dl.typesense.org/releases/29.0/typesense-server-29.0-linux-amd64.tar.gz -o api_tests/artifacts/v29.tar.gz &&
            tar -xzf api_tests/artifacts/v29.tar.gz -C api_tests/artifacts/v29/'

      - name: Download Typesense Binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: typesense-server
          path: ./typesense-server-binary

      - name: Make binary executable
        run: chmod +x ./typesense-server-binary/typesense-server

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        working-directory: api_tests
        run: bun install

      - name: Install typesense-api-tests
        working-directory: api_tests
        run: bun link

      - name: Wait for TEI, gdb and the v29 download
        run: |
          for name in tei gdb v29; do
            if ! timeout 300 bash -c "until [ -f '$RUNNER_TEMP/setup/$name.rc' ]; do sleep 1; done"; then
              echo "$name did not finish in 300 s"; cat "$RUNNER_TEMP/setup/$name.log"; exit 1
            fi
            read -r rc took < "$RUNNER_TEMP/setup/$name.rc"
            echo "$name finished in ${took} s with status $rc"
            if [ "$rc" != 0 ]; then
              cat "$RUNNER_TEMP/setup/$name.log"
              # gdb only serves a hung server's diagnosis, so the tests still run without it
              if [ "$name" = gdb ]; then echo "::warning::gdb did not install"; else echo "$name failed"; exit 1; fi
            fi
          done
          echo "Waiting for TEI Container to be ready..."
          timeout 600 bash -c 'until curl -s http://localhost:8080/health > /dev/null; do sleep 1; done'
          echo "TEI Container is ready!"

      - name: Print TEI Container logs on failure
        if: failure()
        run: docker logs tei-container || echo "No logs found"

      - name: Run API tests with secrets
        if: env.HAS_API_SECRETS == 'true'
        working-directory: api_tests
        env:
          TYPESENSE_BINARY_PATH: ${{ github.workspace }}/typesense-server-binary/typesense-server
          TYPESENSE_V29_BINARY_PATH: ${{ github.workspace }}/api_tests/artifacts/v29/typesense-server
          TYPESENSE_DATA_DIR: ${{ github.workspace }}/tmp/test
          OPEN_AI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_URL: ${{ secrets.AZURE_OPENAI_URL }}
        run: typesense-api-tests

      - name: Run API tests without secrets
        if: env.HAS_API_SECRETS != 'true'
        working-directory: api_tests
        env:
          TYPESENSE_BINARY_PATH: ${{ github.workspace }}/typesense-server-binary/typesense-server
          TYPESENSE_V29_BINARY_PATH: ${{ github.workspace }}/api_tests/artifacts/v29/typesense-server
          TYPESENSE_DATA_DIR: ${{ github.workspace }}/tmp/test
          OPEN_AI_API_KEY: ""
        run: typesense-api-tests --no-secrets

      # every server's log and stdout/stderr, and the stacks of one that didn't stop
      - name: Save API test logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-test-logs
          path: |
            tmp/test/**/logs/
            api_tests/data/**/logs/
            ${{ runner.temp }}/setup/
          if-no-files-found: warn

      - name: Cleanup TEI Container
        if: always()
        run: |
          docker stop tei-container || true
          docker rm tei-container || true
